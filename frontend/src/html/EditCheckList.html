<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>チェックリスト追加編集画面</title>
  <link rel="stylesheet" href="../css/EditCheckList.css">
</head>
<body>

  <div class="checklist-page">

    <!-- ヘッダー -->
    <header class="checklist-header">
      <h1 class="checklist-title">
        チェックリスト<br>
        追加編集画面
      </h1>

      <div class="header-buttons">
        <button class="header-button header-button-add" type="button">
          追加

        <button class="header-button header-button-save" type="button">
          保存
        </button>

        <button class="header-button header-button-delete" type="button">
          削除
        </button>
      </div>
    </header>

    <!-- チェックリスト -->
    <main class="checklist-main">
      <div class="checklist-table">

        <label class="checklist-row">
          <span class="checklist-checkbox-area">
            <input class="checklist-checkbox" type="checkbox">
          </span>
          <span class="checklist-item">項目1</span>
        </label>

        <label class="checklist-row">
          <span class="checklist-checkbox-area">
            <input class="checklist-checkbox" type="checkbox">

        <label class="checklist-row">

          </span>

        </label>

        <label class="checklist-row">
          <span class="checklist-checkbox-area">
            <input class="checklist-checkbox" type="checkbox">
          </span>
          <span class="checklist-item">項目4</span>
        </label>

        <label class="checklist-row">
          <span class="checklist-checkbox-area">
            <input class="checklist-checkbox" type="checkbox">
          </span>
          <span class="checklist-item">項目5</span>
        </label>

        <label class="checklist-row">
          <span class="checklist-checkbox-area">
            <input class="checklist-checkbox" type="checkbox">
          </span>
          <span class="checklist-item">項目6</span>
        </label>

        <label class="checklist-row">
          <span class="checklist-checkbox-area">
            <input class="checklist-checkbox" type="checkbox">
          </span>
          <span class="checklist-item">項目7</span>
        </label>

        <label class="checklist-row">

        <label class="checklist-row">
          <span class="checklist-checkbox-area">
            <input class="checklist-checkbox" type="checkbox">
          </span>
          <span class="checklist-item">項目9</span>
        </label>

        <label class="checklist-row">
          <span class="checklist-checkbox-area">
            <input class="checklist-checkbox" type="checkbox">
          </span>
          <span class="checklist-item">項目10</span>

            <input class="checklist-checkbox" type="checkbox">

          <span class="checklist-item">項目11</span>

      </div>
    </main>

</html>
