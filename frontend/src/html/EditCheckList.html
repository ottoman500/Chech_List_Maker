<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>チェックリスト追加編集画面</title>
  <link rel="stylesheet" href="../css/EditCheckList.css">
</head>
<body>

  <div class="checklist-page">

    <!-- ヘッダー -->
    <header class="checklist-header">
      <h1 class="checklist-title">
        チェックリスト<br>
        追加編集画面
      </h1>

      <div class="header-buttons">
        <button class="header-button header-button-add" type="button">
          追加
        </button>

        <button class="header-button header-button-delete" type="button">
          削除
        </button>
      </div>
    </header>

    <!-- チェックリスト -->
    <main class="checklist-main">
      <div class="checklist-table">

        <div class="checklist-row">
          <input type="text" class="checklist-item" value="項目1">
        </div>

        <div class="checklist-row">
          <input type="text" class="checklist-item" value="項目2">
        </div>

        <div class="checklist-row">
          <input type="text" class="checklist-item" value="項目3">
        </div>

        <div class="checklist-row">
          <input type="text" class="checklist-item" value="項目4">
        </div>

        <div class="checklist-row">
          <input type="text" class="checklist-item" value="項目5">
        </div>

        <div class="checklist-row">
          <input type="text" class="checklist-item" value="項目6">
        </div>

        <div class="checklist-row">
          <input type="text" class="checklist-item" value="項目7">
        </div>

        <div class="checklist-row">
          <input type="text" class="checklist-item" value="項目8">
        </div>

        <div class="checklist-row">
          <input type="text" class="checklist-item" value="項目9">
        </div>

        <div class="checklist-row">
          <input type="text" class="checklist-item" value="項目10">
        </div>

        <div class="checklist-row">
          <input type="text" class="checklist-item" value="項目11">
        </div>

      </div>
    </main>

    <!-- フッター -->
    <footer class="checklist-footer">
      <div class="footer-buttons">
        <button class="footer-button footer-button-save" type="button">
          保存
        </button>

        <button class="footer-button footer-button-back" type="button">
          戻る
        </button>        
      </div>
    </footer>

  </div>

</body>
</html>
