<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>チェックリスト</title>
  <link rel="stylesheet" href="../css/CheckList.css">
</head>
<body>

  <div class="checklist-page">

    <!-- ヘッダー -->
    <header class="checklist-header">

      <h1 class="checklist-title">チェックリスト</h1>

      <div class="progress-area">
        <div class="progress-label">進捗率</div>
        <div class="progress-value">20%</div>
      </div>

      <div class="header-actions">
        <button class="header-button back-button" type="button">
          一覧に戻る
        </button>

        <button class="header-button edit-button" type="button">
          編集
        </button>
      </div>

    </header>

    <!-- チェックリスト -->
    <main class="checklist-container">

      <div class="checklist-item is-completed">

          <label for="item1" class="check-box-label"></label>
        </div>
        <div class="item-name">項目1</div>
