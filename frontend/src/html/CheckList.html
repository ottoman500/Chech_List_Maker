<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>チェックリスト</title>
  <link rel="stylesheet" href="../css/CheckList.css">
</head>
<body>

  <div class="checklist-page">

    <!-- ヘッダー -->
    <header class="checklist-header">

      <h1 class="checklist-title">チェックリスト</h1>

      <div class="progress-area">
        <div class="progress-label">進捗率</div>
        <div class="progress-value">20%</div>
      </div>

      <div class="header-actions">
        <button class="header-button back-button" type="button">
          一覧に戻る
        </button>

        <button class="header-button edit-button" type="button">
          編集
        </button>
      </div>

    </header>

    <!-- チェックリスト -->
    <main class="checklist-container">

      <!-- 各項目全体をlabelタグに変更することで、行全体のどこをクリックしても反応するように改善 -->
      <label class="checklist-item">
        <div class="checkbox-area">
          <input type="checkbox" id="item1" class="check-box" checked>
          <span class="check-box-label"></span>
        </div>
        <span class="item-name">項目1</span>
      </label>

      <label class="checklist-item">
        <div class="checkbox-area">
          <input type="checkbox" id="item2" class="check-box" checked>
          <span class="check-box-label"></span>
        </div>
        <span class="item-name">項目2</span>
      </label>

      <label class="checklist-item">
        <div class="checkbox-area">
          <input type="checkbox" id="item3" class="check-box">
          <span class="check-box-label"></span>
        </div>
        <span class="item-name">項目3</span>
      </label>

      <label class="checklist-item">
        <div class="checkbox-area">
          <input type="checkbox" id="item4" class="check-box">
          <span class="check-box-label"></span>
        </div>
        <span class="item-name">項目4</span>
      </label>

      <label class="checklist-item">
        <div class="checkbox-area">
          <input type="checkbox" id="item5" class="check-box">
          <span class="check-box-label"></span>
        </div>
        <span class="item-name">項目5</span>
      </label>

      <label class="checklist-item">
        <div class="checkbox-area">
          <input type="checkbox" id="item6" class="check-box">
          <span class="check-box-label"></span>
        </div>
        <span class="item-name">項目6</span>
      </label>

      <label class="checklist-item">
        <div class="checkbox-area">
          <input type="checkbox" id="item7" class="check-box">
          <span class="check-box-label"></span>
        </div>
        <span class="item-name">項目7</span>
      </label>

      <label class="checklist-item">
        <div class="checkbox-area">
          <input type="checkbox" id="item8" class="check-box">
          <span class="check-box-label"></span>
        </div>
        <span class="item-name">項目8</span>
      </label>

      <label class="checklist-item">
        <div class="checkbox-area">
          <input type="checkbox" id="item9" class="check-box">
          <span class="check-box-label"></span>
        </div>
        <span class="item-name">項目9</span>
      </label>

      <label class="checklist-item">
        <div class="checkbox-area">
          <input type="checkbox" id="item10" class="check-box">
          <span class="check-box-label"></span>
        </div>
        <span class="item-name">項目10</span>
      </label>

      <label class="checklist-item">
        <div class="checkbox-area">
          <input type="checkbox" id="item11" class="check-box">
          <span class="check-box-label"></span>
        </div>
        <span class="item-name">項目11</span>
      </label>

    </main>

  </div>

</body>
</html>
