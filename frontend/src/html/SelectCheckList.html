<!doctype html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <title>check_list_maker</title>

  <link rel="stylesheet" href="../css/SelectCheckList.css" />
</head>

<body>

  <!-- ページ全体 -->
  <div class="check-list-page">
    <!-- タイトル -->
    <h2 class="page-title">
      チェックリスト一覧
    </h2>

    <!-- 右上の操作ボタン -->
    <div class="action-button-area">
      <button
        type="button"
        class="action-button action-button--add"
      >
        新規追加
      </button>
      <button
        type="button"
        class="action-button action-button--delete"
      >
        削除
      </button>
    </div>

    <!-- チェックリスト一覧 -->
    <div class="check-list-table">
      <!-- 検索・ページングエリア -->
      <div class="table-header">
        <!-- 検索エリア -->
        <div class="search-area">
          <input
            type="text"
            class="search-input"
            placeholder="キーワード検索"
          />
          <button
            type="button"
            class="search-button"
          >
            検索
          </button>
        </div>

        <!-- ページングエリア -->
        <div class="pagination-area">
          <span class="page-number">
            1/50
          </span>
          <button
            type="button"
            class="pagination-button"
          >
            ＜
          </button>
          <button
            type="button"
            class="pagination-button"
          >
            ＞
          </button>
        </div>
      </div>


      <!-- テーブル -->
      <div class="table-area">
        <table class="check-list">
          <tbody>
            <tr class="check-list-row">
              <td class="check-box-cell">
                <input
                  type="checkbox"
                  class="check-list-checkbox"
                />
              </td>
              <td class="check-list-name">
                チェックリストA
              </td>
            </tr>


            <tr class="check-list-row">

              </td>
            </tr>


            <tr class="check-list-row">
              <td class="check-box-cell">
                <input
                  type="checkbox"
                  class="check-list-checkbox"
                />
              </td>
              <td class="check-list-name">
                チェックリストD
              </td>
            </tr>

            <tr class="check-list-row">
              <td class="check-box-cell">
                <input
                  type="checkbox"
                  class="check-list-checkbox"
                />
              </td>
              <td class="check-list-name">
                チェックリストE
              </td>
            </tr>


            <tr class="check-list-row">
              <td class="check-box-cell">

            <tr class="check-list-row">

            <tr class="check-list-row">

            </tr>
          </tbody>
        </table>

</body>

</html>
